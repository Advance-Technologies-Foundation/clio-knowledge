name: Release knowledge bundle

# Publishes the signed runtime bundle as an immutable GitHub Release asset, which is how Clio's
# built-in `creatio-curated` source is delivered. It never triggers on a push itself: it runs on a
# version tag or an explicit dispatch. `auto-release-on-merge.yml` dispatches it after a merge to
# master, and only when the `libraryVersion` in bundle-source.json has no published release yet — so
# the publishing decision is still made deliberately, in the pull request that bumps that version.
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      library_version:
        description: >-
          The libraryVersion in bundle-source.json, repeated here as a confirmation. The run fails if
          it does not match, so a dispatch cannot publish a generation the operator did not intend.
        required: true
        type: string

permissions:
  contents: write

env:
  ASSET_NAME: clio-knowledge-bundle.zip
  # The key ID stamped into the manifest signature block. Clio pins the matching public key in its
  # own binary; rotating means shipping the successor key in Clio first, then switching here.
  SIGNING_KEY_ID: clio-knowledge-2026-08
  PUBLIC_KEY_PATH: distribution/keys/clio-knowledge-2026-08-public.pem

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact commit being published
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run the producer contract suite
        run: dotnet test automation/Clio.Knowledge.Bundle.Tests/Clio.Knowledge.Bundle.Tests.csproj -c Release

      # The tag is what a consumer records as the installed revision, and Clio refuses a bundle whose
      # libraryVersion differs from it. Resolving and comparing here turns that into a build failure
      # instead of a release nobody can install.
      - name: Resolve and check the generation identity
        id: identity
        run: |
          set -euo pipefail
          library_version="$(jq -er '.libraryVersion' bundle-source.json)"
          sequence="$(jq -er '.sequence' bundle-source.json)"
          if [ "${{ github.event_name }}" = "push" ]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="${{ inputs.library_version }}"
          fi
          if [ "${tag}" != "${library_version}" ]; then
            echo "Tag '${tag}' does not match bundle-source.json libraryVersion '${library_version}'." >&2
            exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "sequence=${sequence}" >> "$GITHUB_OUTPUT"
          echo "Publishing ${library_version} (sequence ${sequence}) from ${GITHUB_SHA}."

      # A published release is immutable and a sequence may never be reused with different content,
      # so an existing published release for this tag is a stop, never something to overwrite. A
      # leftover DRAFT is different: it was never visible to a consumer and can only be this
      # workflow's own failed attempt, so it is cleared rather than requiring a manual cleanup
      # before every retry.
      - name: Refuse to overwrite a published release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.identity.outputs.tag }}
        run: |
          set -euo pipefail
          existing="$(gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate \
            --jq ".[] | select(.tag_name == \"${TAG}\") | \"\(.id) \(.draft)\"")"
          if [ -z "${existing}" ]; then
            exit 0
          fi
          release_id="${existing%% *}"
          is_draft="${existing##* }"
          if [ "${is_draft}" != "true" ]; then
            echo "Release ${TAG} is already published; bump libraryVersion and sequence." >&2
            exit 1
          fi
          echo "Clearing leftover draft release ${TAG} (id ${release_id}) from a previous failed run."
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/${release_id}"

      - name: Build and sign the bundle
        env:
          SIGNING_PRIVATE_KEY: ${{ secrets.KNOWLEDGE_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SIGNING_PRIVATE_KEY}" ]; then
            echo "KNOWLEDGE_SIGNING_PRIVATE_KEY is not configured for this repository." >&2
            exit 1
          fi
          mkdir -p artifacts
          key_file="$(mktemp)"
          # The key never reaches the workspace, the logs, or the uploaded artifact.
          umask 077
          printf '%s\n' "${SIGNING_PRIVATE_KEY}" > "${key_file}"
          trap 'shred -u "${key_file}" 2>/dev/null || rm -f "${key_file}"' EXIT
          dotnet run --project automation/Clio.Knowledge.Bundle -c Release -- build \
            bundle-source.json \
            "${key_file}" \
            "artifacts/${ASSET_NAME}" \
            "${SIGNING_KEY_ID}" \
            "${GITHUB_REPOSITORY}" \
            "${GITHUB_SHA}"

      - name: Verify the artifact before publication
        run: |
          set -euo pipefail
          dotnet run --project automation/Clio.Knowledge.Bundle -c Release -- verify \
            "artifacts/${ASSET_NAME}" \
            "${PUBLIC_KEY_PATH}" \
            "${SIGNING_KEY_ID}" \
            "${{ steps.identity.outputs.tag }}"
          sha256sum "artifacts/${ASSET_NAME}" | tee artifacts/checksum.txt

      # Draft first: a release only becomes visible after its asset is uploaded and re-verified, so a
      # consumer can never observe a release whose asset is missing or still uploading.
      - name: Create the draft release
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.identity.outputs.tag }}
        run: |
          set -euo pipefail
          # Created through the API rather than `gh release create` so the response itself carries the
          # release ID. A draft has no published tag, so `GET /releases/tags/{tag}` answers 404 and
          # only the ID can address it later — and reading the ID back from the release LIST is
          # unreliable, because that endpoint lags creation by a few hundred milliseconds.
          release_id="$(gh api --method POST "repos/${GITHUB_REPOSITORY}/releases" \
            -f tag_name="${TAG}" \
            -f target_commitish="${GITHUB_SHA}" \
            -f name="clio-knowledge ${TAG}" \
            -f body="Signed runtime knowledge bundle, sequence ${{ steps.identity.outputs.sequence }}, built from ${GITHUB_SHA}." \
            -F draft=true \
            -F prerelease=false \
            --jq '.id')"
          if [ -z "${release_id}" ]; then
            echo "Draft release ${TAG} could not be created." >&2
            exit 1
          fi
          echo "Created draft release ${TAG} (id ${release_id})."
          echo "release-id=${release_id}" >> "$GITHUB_OUTPUT"

      - name: Upload the bundle asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "${{ steps.identity.outputs.tag }}" "artifacts/${ASSET_NAME}" --clobber

      # Proves the transfer, not just the build: the bytes GitHub will serve are downloaded back and
      # verified against the publisher key, and the digest GitHub advertises is compared with them.
      - name: Verify the uploaded asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p verification
          gh release download "${{ steps.identity.outputs.tag }}" \
            --pattern "${ASSET_NAME}" \
            --dir verification
          dotnet run --project automation/Clio.Knowledge.Bundle -c Release -- verify \
            "verification/${ASSET_NAME}" \
            "${PUBLIC_KEY_PATH}" \
            "${SIGNING_KEY_ID}" \
            "${{ steps.identity.outputs.tag }}"
          published_digest="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${{ steps.draft.outputs.release-id }}" \
            --jq ".assets[] | select(.name == \"${ASSET_NAME}\") | .digest")"
          local_digest="sha256:$(sha256sum "verification/${ASSET_NAME}" | cut -d' ' -f1)"
          if [ "${published_digest}" != "${local_digest}" ]; then
            echo "GitHub published digest '${published_digest}' does not match the uploaded bytes." >&2
            exit 1
          fi
          echo "Asset digest verified: ${published_digest}"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${{ steps.draft.outputs.release-id }}" \
            -F draft=false \
            -F make_latest=true >/dev/null
          echo "Published ${{ steps.identity.outputs.tag }}; Clio discovers it through releases/latest."
