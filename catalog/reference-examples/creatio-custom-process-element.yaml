compatibility:
  status: example-declared
  details: Creatio 10.1.585.0 on .NET 8/PostgreSQL with Clio 8.1.0.130, and Creatio 10.1.784.0 on .NET Framework 4.8/SQL Server 2025 Express with Clio 8.1.0.131. PostgreSQL verified v0.1.0 fresh installation and v0.2.0 upgrade; MSSQL verified the unchanged v0.2.0 archive on a fresh non-FSM instance and forced script re-execution using a local timestamped validation copy.
trust:
  publisher: Advance Technologies Foundation
  level: published
notes:
  - Version 0.2.0 corrects omitted formatter directions without changing parameter identities; its portable metadata contract guard covers all five tasks. The upgraded text output selector excludes Text and Prefix.
  - 27 local unit cases passed in the .NET 8 workspace. Ten live process cases passed on each database. MSSQL browser acceptance covers one toolbox entry and four separate pages; persistence and output-reference guards retain PostgreSQL-only evidence.
  - The integration runner selects service routes from registered IsNetCore and supports IntegrationOnly when local proprietary unit-test dependencies are unavailable. See docs/clean-install-verification.md for setup failures, recovery and version boundaries.
  - The single-entry toolbox exclusion override uses an internal Classic designer method and requires upgrade regression testing.
  - Typed process models use Single for the tested Float2 parameters; arbitrary decimal precision across that boundary is not established.
  - A licensed Creatio environment and matching local platform/test dependencies are required; proprietary binaries are not distributed.
  - Registration does not promote every example implementation choice to a cross-version platform guarantee.
