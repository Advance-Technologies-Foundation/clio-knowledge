title: Creatio localization reference
status: published
primaryUseCase:
  id: creatio-schema-owned-localizable-values
  summary: Demonstrate schema-owned backend and Freedom UI localizable values through an injectable LocalizableString adapter, deterministic fallback cases, and stand-free plus live Creatio tests.
source:
  repository: https://github.com/Advance-Technologies-Foundation/creatio-localization-lab
  revision: 2e65b3537c37bfb8b4264e3dc871828fb95c94c8
  defaultBranch: main
entryPoints:
  overview: README.md
  package: packages/AtfLocalizationLab
  unitTests: tests/AtfLocalizationLab
  backendResolver: packages/AtfLocalizationLab/Files/src/cs/LocalizableStrings/LocalizableStringResolver.cs
supportingCapabilities:
  - creatio-schema-owned-resources
  - backend-localizable-string-resolution
  - dependency-injection
  - freedom-ui-localization
  - strict-culture-lookup
  - culture-fallback
  - unit-testing
  - live-creatio-testing
compatibility:
  status: example-declared
  details: Uses Creatio 8.3.3 as its supported baseline; live-verified on Creatio 10.1.585.0, .NET 8, PostgreSQL.
trust:
  publisher: Advance Technologies Foundation
  level: published
notes:
  - This is an educational reference workspace, not a package-wide localization registry.
  - The pinned revision contains 19 stand-free tests with 100% line, branch, and method coverage plus 14 live Creatio tests, including native designer discovery and save/readback.
  - Registration does not promote every implementation choice to canonical Clio guidance.
  - Normal backend strings include both B2 declarations and culture XML; XML-only and metadata-only keys are labeled diagnostics.
  - The backend owner is UsrAtfLocalizationLabMessages; its original schema UId is preserved. See docs/localizable-metadata-validation.md for the rename and tested boundaries.
