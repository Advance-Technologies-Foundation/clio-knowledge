notes:
  - 120 real-user E2E tests and 2 focused unit tests passed; stored-grant read/grant/read/revoke/read also verified through clio MCP.
  - Includes native Entity and DataService allow/deny matrices, distinct mutation predicates, same-session context changes, and missing/null/inactive fallback cases.
  - The package contains privileged fixed-schema test controls; install the complete fixture only on an exclusive disposable environment.
  - Does not certify delegation policy, conflicting stored grants, operation-denial precedence, browser UI, external users, web farms or performance.
  - Registration makes this runnable reference discoverable; incidental example choices are not universal business policy.
